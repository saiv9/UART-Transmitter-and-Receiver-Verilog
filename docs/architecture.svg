<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470">
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#26364a;stroke-width:2}.block{fill:#eaf2ff;stroke:#315d91;stroke-width:2}
      .signal{fill:none;stroke:#26364a;stroke-width:2.4;marker-end:url(#arrow)}.bus{fill:none;stroke:#287a63;stroke-width:2.4;marker-end:url(#greenArrow)}
      .title{font:700 23px Arial,sans-serif;fill:#17283d}.head{font:700 17px Arial,sans-serif;fill:#17324d}
      .txt{font:14px Arial,sans-serif;fill:#26364a}.small{font:12px Arial,sans-serif;fill:#46566b}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#26364a"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#287a63"/></marker>
  </defs>
  <rect class="bg" width="1100" height="470" rx="18"/>
  <text class="title" x="550" y="42" text-anchor="middle">UART Transmitter and Receiver Architecture</text>
  <rect class="panel" x="36" y="78" width="1028" height="330" rx="14"/>
  <text class="head" x="70" y="112">Parallel transmit path</text>
  <rect class="block" x="72" y="140" width="190" height="80" rx="9"/>
  <text class="head" x="167" y="172" text-anchor="middle">TX data</text><text class="txt" x="167" y="196" text-anchor="middle">tx_start + tx_data</text>
  <rect class="block" x="340" y="140" width="230" height="80" rx="9"/>
  <text class="head" x="455" y="172" text-anchor="middle">UART transmitter</text><text class="txt" x="455" y="196" text-anchor="middle">Start / data / stop timing</text>
  <path class="signal" d="M262 180 H340"/>
  <rect class="block" x="650" y="140" width="180" height="80" rx="9"/>
  <text class="head" x="740" y="172" text-anchor="middle">Serial TX</text><text class="txt" x="740" y="196" text-anchor="middle">LSB first</text>
  <path class="signal" d="M570 180 H650"/>
  <text class="small" x="867" y="170">tx_busy</text><text class="small" x="867" y="192">tx_done</text>
  <path class="signal" d="M830 180 H860"/>
  <line x1="70" y1="252" x2="1030" y2="252" stroke="#c8d3e0" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="head" x="70" y="286">Serial receive path</text>
  <rect class="block" x="72" y="306" width="160" height="70" rx="9"/>
  <text class="head" x="152" y="337" text-anchor="middle">Serial RX</text><text class="txt" x="152" y="358" text-anchor="middle">asynchronous input</text>
  <rect class="block" x="300" y="306" width="205" height="70" rx="9"/>
  <text class="head" x="402" y="337" text-anchor="middle">2-flop synchronizer</text><text class="txt" x="402" y="358" text-anchor="middle">clock-domain sampling</text>
  <rect class="block" x="575" y="306" width="205" height="70" rx="9"/>
  <text class="head" x="677" y="337" text-anchor="middle">UART receiver</text><text class="txt" x="677" y="358" text-anchor="middle">center-bit sampling</text>
  <rect class="block" x="850" y="306" width="175" height="70" rx="9"/>
  <text class="head" x="937" y="337" text-anchor="middle">RX status/data</text><text class="txt" x="937" y="358" text-anchor="middle">rx_valid / error</text>
  <path class="signal" d="M232 341 H300"/><path class="signal" d="M505 341 H575"/><path class="bus" d="M780 341 H850"/>
  <path class="bus" d="M740 220 V266 H152 V306"/>
  <text class="small" x="465" y="262" text-anchor="middle">Loopback is connected in the testbench; TX and RX remain separate top-level ports</text>
</svg>
